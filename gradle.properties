# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=26.1.2
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.1.2     multiple: minecraft_compat_versions=26.1:26.1.1:26.1.2
minecraft_compat_versions=26.1:26.1.1:26.1.2

# Loader
enabled_platforms = fabric,neoforge
fabric_loader_version=0.19.3
neoforge_version = 26.1.2.94

# Mod
maven_group=net.rpg_series
archives_name=wizards
mod_version=3.1.2.005

# Dependencies
fabric_api_version=0.155.2+26.1.2
tiny_config_version=4.0.0
cloth_config_version=26.1.154
player_anim_version=1.2.6+mc.26.1

armor_model_api_version=1.0.3.001+26.1.2
runes_version=1.3.3.001+26.1.2
structure_pool_api_version=1.3.1.001+26.1.2
spell_power_version=1.6.2.001+26.1.2
spell_engine_version=1.10.5.002+26.1.2
ranged_weapon_api_version=4.0.1.001+26.1.2

# Fabric only
# Trinkets Updated 4.0 (mod id `trinkets_updated`, API package eu.pb4.trinkets.api) no longer uses
# Cardinal Components; it nests yumi-mc-foundation. Dev-runtime only (SpellEngine's optional integration).
trinkets_version=4.0.0-rc.1+26.1
mod_menu_version=18.0.0

# NeoForge only
curios_version=15.0.0+26.1.2
