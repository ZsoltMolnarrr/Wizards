modLoader = "javafml"
loaderVersion = "[47,)"
issueTrackerURL = "https://github.com/ZsoltMolnarrr/Wizards/issues"
license = "All Rights Reserved"

[[mods]]
modId = "wizards"
version = "${version}"
displayName = "Wizards (RPG Series)"
authors = "Daedelus"
description = '''
Destroy your enemies with Arcane, Fire and Frost magic.
'''
logoFile = "icon.png"

[[dependencies.wizards]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.wizards]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.wizards]]
modId = "armor_model_api"
mandatory = true
versionRange = "[1.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.wizards]]
modId = "spell_engine"
mandatory = true
versionRange = "[1.10.5,)"
ordering = "AFTER"
side = "BOTH"

# Runes is optional. Wizards does not compile against it — the wizard-merchant workstation and its rune
# trades are resolved by registry id and simply stay inert when it is absent.
[[dependencies.wizards]]
modId = "runes"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# StructurePoolAPI injects the wizard towers into the *vanilla* village pools. Since 1.2.1 it has a
# Forge artifact, so this is a hard dependency on both loaders (mirrors the `fabric.mod.json` entry).
[[dependencies.wizards]]
modId = "structure_pool_api"
mandatory = true
versionRange = "[1.2.1,)"
ordering = "NONE"
side = "BOTH"

# Mixin configs are declared in the jar MANIFEST (`MixinConfigs:`) by Loom (`loom.forge.mixinConfig`),
# not in this file — the `[[mixins]]` table is NeoForge-only.
