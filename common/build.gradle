architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven { url = 'https://repo.redlance.org/public' } // PAL (Player Animation Library)
    maven { url = 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://maven.fabricmc.net' }

    // Hosts `dev.emi:trinkets`, inherited transitively from SpellEngine's Fabric artifact.
    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    implementation("com.zigythebird.playeranim:PlayerAnimationLibCommon:${project.player_anim_version}")
    // Core has no Minecraft references: plain implementation (remapping it would poison the loom cache)
    implementation("com.zigythebird.playeranim:PlayerAnimationLibCore:${project.player_anim_version}")
    implementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")
    implementation("net.rpg_foundation:armor_model_api-${platform}:${project.armor_model_api_version}")
//    implementation("maven.modrinth:armor-model-api:${project.armor_model_api_version}-${platform}")
    implementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}")

    implementation("net.rpg_foundation:structure_pool_api-${platform}:${project.structure_pool_api_version}")
//    implementation("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}-${platform}")
    implementation("net.rpg_series:runes-${platform}:${project.runes_version}")
//    implementation("maven.modrinth:runes:${project.runes_version}-${platform}")
    implementation("net.spell_power:spell_power-${platform}:${project.spell_power_version}")
//    implementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    implementation("net.rpg_foundation:ranged_weapon_api-${platform}:${project.ranged_weapon_api_version}")
    implementation("net.spell_engine:spell_engine-${platform}:${project.spell_engine_version}") { transitive = false }
//    implementation("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")

    // Compatibility
    // Fabric specific
}
