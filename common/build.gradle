architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // No Fabric API in common: there is no Forgified Fabric API on the 1.20.1 line, so loader API
    // usage stays in the platform modules (fabric/ and forge/).

    modImplementation("dev.kosmx.player-anim:player-animation-lib-${platform}:${rootProject.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}")

    // Ecosystem libraries from mavenLocal (published by their 1.20.1-modern ports).
    modImplementation("net.rpg_foundation:armor_model_api-${platform}:${rootProject.armor_model_api_version}")
    modImplementation("net.tiny_config:tiny_config-${platform}:${rootProject.tiny_config_version}")
    modImplementation("net.spell_power:spell_power-${platform}:${rootProject.spell_power_version}")
    modImplementation("net.spell_engine:spell_engine-${platform}:${rootProject.spell_engine_version}") { transitive = false }

    // StructurePoolAPI: legacy published Fabric-only artifact (no Forge port on 1.20.1). Village
    // structure injection therefore lives behind the `net.wizards.village.VillageStructures` seam,
    // whose only implementation is wired from the Fabric entrypoint.
    // Runes is NOT on the compile classpath any more (registry-id lookups only) — see wizards-port-notes.md.
}
