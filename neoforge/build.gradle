plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

def platform = project.name;

architectury {
    platformSetupLoomIde()
    neoForge()
}

def generatedResources = project(':common').file('src/main/generated')
sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.azuredoom.com/mods' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }

    // For Curios (transitive from SpellEngine on NeoForge)
    maven { url 'https://maven.theillusivec4.top/' }

    mavenLocal()
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation("dev.kosmx.player-anim:player-animation-lib-forge:${project.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")
    modImplementation("mod.azure.azurelibarmor:azurelibarmor-neo-${project.azure_mc_version}:${project.azure_lib_version}")
    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}")


    modImplementation("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}-${platform}")
//    modImplementation("net.foundation:structure_pool_api-${platform}:${project.structure_pool_api_version}")
    modImplementation("maven.modrinth:runes:${project.runes_version}-${platform}")
//    modImplementation("net.rpg_series:runes-${platform}:${project.runes_version}")
    modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
//    modImplementation("net.spell_power:spell_power-${platform}:${project.spell_power_version}")
    modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
//    modImplementation("net.spell_engine:spell_engine-${platform}:${project.spell_engine_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        def cleanedProps = project.properties.collectEntries { k, v ->
            def s = v?.toString()
            [(k.toString()): (s?.contains('+') ? s.substring(0, s.indexOf('+')) : s)]
        }
        expand(cleanedProps)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Publishing is configured unconditionally: tasks only *run* when explicitly invoked
// (e.g. `publishMod` in CI), and all credentials are lazy env providers, so a local
// `build` — with none of the tokens present — is completely unaffected.
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Convenience alias: build + publish to every configured destination in one go.
// CI does NOT use this -- `publish.yml` invokes `:neoforge:build` plus an explicit subset of
// the plugin's per-destination tasks (`publishCurseforge` / `publishModrinth` /
// `publishGithub`), so a release can target only some platforms. Keep that in mind when
// changing this alias: it is now a local/manual convenience, not the CI entry point.
// The plugin's own aggregate task is `publishMods` (plural).
tasks.register("publishMod") {
    dependsOn(build)
    finalizedBy(tasks.named("publishMods"))
}

publishMods {
    file = remapJar.archiveFile          // Loom production jar (NOT the dev-shadow jar)
    changelog = providers.provider { changelog_last_section() }   // lazy: read only at publish
    type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA
    version = "${project.version}-${platform}"   // per-loader suffix → unique Modrinth version
    displayName = "${project.version}"
    modLoaders.add("neoforge")

    curseforge {
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")   // numeric id
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        minecraftVersions.add(project.minecraft_compat_version)
        client = true                    // >=1 of client/server REQUIRED by CurseForge (Error 1021)
        server = true
        changelogType = "markdown"
        requires("azurelib-armor", "spell-engine", "rune-crafting", "structure-pool-api")
    }

    modrinth {
        // Modrinth side metadata -- without it the version publishes as "Unknown".
        environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
        projectId = providers.environmentVariable("MODRINTH_PROJECT_RAW_ID")
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        minecraftVersions.add(project.minecraft_compat_version)
        requires { slug = "azurelib-armor" }
        requires { slug = "spell-engine" }
        requires { slug = "runes" }
        requires { slug = "structure-pool-api" }
    }

    // Each platform publishes its own GitHub release under a distinct, platform-suffixed
    // tag (e.g. `1.0.0+1.21.1-neoforge`), so the two publish jobs don't collide.
    github {
        repository = providers.environmentVariable("GH_OWNER")
                .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
        accessToken = providers.environmentVariable("GH_API_KEY")
        tagName = "${project.version}-${platform}"
        // `commitish` is REQUIRED by the plugin. GITHUB_SHA is set automatically by GitHub
        // Actions to the triggering commit — valid even in a detached-HEAD checkout.
        commitish = providers.environmentVariable("GITHUB_SHA")
    }
}

// The GitHub release is the *seal* on a successful publish, so it must run LAST: if a mod
// host upload fails (e.g. a CurseForge 500), Gradle aborts the build before the release is
// created, so there is never a green GitHub release pointing at a half-published version.
// `mustRunAfter` is an ordering rule ONLY -- it does not pull the referenced tasks into the
// graph. A Modrinth-only run therefore still works and simply ignores the CurseForge rule.
// This matters because command-line task order is NOT an execution-order guarantee.
// NOTE: must sit AFTER the `publishMods` block -- the plugin registers one task per
// destination while that block is evaluated, so these names do not exist before it.
tasks.named("publishGithub") {
    mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
